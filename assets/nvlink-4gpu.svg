<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
<title id="title">Four-GPU NVLink — continuous connection paths</title>
<desc id="description">Six GPU peer connections with the E and F diagonals forming an X. Their crossing is not a junction. Letters A to F match the separate connection key, which lists the two NVHS group pairings per peer. Physical GPU placement and trace routing are not prescribed.</desc>
<rect width="1440" height="960" fill="#1E1E2E"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="54" y="63" fill="#B4BEFE" font-size="34" font-weight="bold" text-anchor="start">4-GPU NVLink connection plan</text>
<text x="54" y="101" fill="#BAC2DE" font-size="20" font-weight="normal" text-anchor="start">Follow the whole path. Match its letter to the group pairings on the right.</text>
<text x="54" y="150" fill="#BAC2DE" font-size="15" font-weight="bold" text-anchor="start">GPU PEER CONNECTIONS</text>
<text x="968" y="150" fill="#BAC2DE" font-size="15" font-weight="bold" text-anchor="start">CONNECTION KEY</text>
<path id="connection-A" data-gpu-a="GPU0" data-gpu-b="GPU1" d="M 315 310 H 725" stroke="#89B4FA" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="287" fill="#89B4FA" font-size="23" font-weight="bold" text-anchor="middle">A</text>
<rect x="968" y="178" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="211" fill="#89B4FA" font-size="24" font-weight="bold" text-anchor="start">A</text>
<text x="1030" y="210" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 0 ↔ GPU 1</text>
<text x="1030" y="236" fill="#89B4FA" font-size="20" font-weight="normal" text-anchor="start">NVHS0 ↔ NVHS3</text>
<text x="1030" y="261" fill="#89B4FA" font-size="20" font-weight="normal" text-anchor="start">NVHS1 ↔ NVHS2</text>
<path id="connection-B" data-gpu-a="GPU2" data-gpu-b="GPU3" d="M 315 650 H 725" stroke="#CBA6F7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="690" fill="#CBA6F7" font-size="23" font-weight="bold" text-anchor="middle">B</text>
<rect x="968" y="287" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="320" fill="#CBA6F7" font-size="24" font-weight="bold" text-anchor="start">B</text>
<text x="1030" y="319" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 2 ↔ GPU 3</text>
<text x="1030" y="345" fill="#CBA6F7" font-size="20" font-weight="normal" text-anchor="start">NVHS0 ↔ NVHS3</text>
<text x="1030" y="370" fill="#CBA6F7" font-size="20" font-weight="normal" text-anchor="start">NVHS1 ↔ NVHS2</text>
<path id="connection-C" data-gpu-a="GPU0" data-gpu-b="GPU2" d="M 240 355 V 605" stroke="#94E2D5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="208" y="488" fill="#94E2D5" font-size="23" font-weight="bold" text-anchor="middle">C</text>
<rect x="968" y="396" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="429" fill="#94E2D5" font-size="24" font-weight="bold" text-anchor="start">C</text>
<text x="1030" y="428" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 0 ↔ GPU 2</text>
<text x="1030" y="454" fill="#94E2D5" font-size="20" font-weight="normal" text-anchor="start">NVHS4 ↔ NVHS5</text>
<text x="1030" y="479" fill="#94E2D5" font-size="20" font-weight="normal" text-anchor="start">NVHS5 ↔ NVHS4</text>
<path id="connection-D" data-gpu-a="GPU1" data-gpu-b="GPU3" d="M 800 355 V 605" stroke="#FAB387" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="832" y="488" fill="#FAB387" font-size="23" font-weight="bold" text-anchor="middle">D</text>
<rect x="968" y="505" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="538" fill="#FAB387" font-size="24" font-weight="bold" text-anchor="start">D</text>
<text x="1030" y="537" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 1 ↔ GPU 3</text>
<text x="1030" y="563" fill="#FAB387" font-size="20" font-weight="normal" text-anchor="start">NVHS4 ↔ NVHS5</text>
<text x="1030" y="588" fill="#FAB387" font-size="20" font-weight="normal" text-anchor="start">NVHS5 ↔ NVHS4</text>
<path id="connection-E" data-gpu-a="GPU0" data-gpu-b="GPU3" d="M 315 340 L 725 620" stroke="#F9E2AF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="388" fill="#F9E2AF" font-size="23" font-weight="bold" text-anchor="middle">E</text>
<rect x="968" y="614" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="647" fill="#F9E2AF" font-size="24" font-weight="bold" text-anchor="start">E</text>
<text x="1030" y="646" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 0 ↔ GPU 3</text>
<text x="1030" y="672" fill="#F9E2AF" font-size="20" font-weight="normal" text-anchor="start">NVHS2 ↔ NVHS1</text>
<text x="1030" y="697" fill="#F9E2AF" font-size="20" font-weight="normal" text-anchor="start">NVHS3 ↔ NVHS0</text>
<path id="connection-F" data-gpu-a="GPU1" data-gpu-b="GPU2" d="M 725 340 L 315 620" stroke="#B4BEFE" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="620" y="388" fill="#B4BEFE" font-size="23" font-weight="bold" text-anchor="middle">F</text>
<rect x="968" y="723" width="418" height="97" rx="11" fill="#313244"/>
<text x="988" y="756" fill="#B4BEFE" font-size="24" font-weight="bold" text-anchor="start">F</text>
<text x="1030" y="755" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">GPU 1 ↔ GPU 2</text>
<text x="1030" y="781" fill="#B4BEFE" font-size="20" font-weight="normal" text-anchor="start">NVHS0 ↔ NVHS3</text>
<text x="1030" y="806" fill="#B4BEFE" font-size="20" font-weight="normal" text-anchor="start">NVHS1 ↔ NVHS2</text>
<rect x="165" y="265" width="150" height="90" rx="14" fill="#313244" stroke="#89B4FA" stroke-width="1.7"/>
<text x="240" y="311" fill="#CDD6F4" font-size="27" font-weight="bold" text-anchor="middle">GPU 0</text>
<text x="240" y="337" fill="#BAC2DE" font-size="14" font-weight="normal" text-anchor="middle">6 NVHS groups</text>
<rect x="725" y="265" width="150" height="90" rx="14" fill="#313244" stroke="#89B4FA" stroke-width="1.7"/>
<text x="800" y="311" fill="#CDD6F4" font-size="27" font-weight="bold" text-anchor="middle">GPU 1</text>
<text x="800" y="337" fill="#BAC2DE" font-size="14" font-weight="normal" text-anchor="middle">6 NVHS groups</text>
<rect x="165" y="605" width="150" height="90" rx="14" fill="#313244" stroke="#89B4FA" stroke-width="1.7"/>
<text x="240" y="651" fill="#CDD6F4" font-size="27" font-weight="bold" text-anchor="middle">GPU 2</text>
<text x="240" y="677" fill="#BAC2DE" font-size="14" font-weight="normal" text-anchor="middle">6 NVHS groups</text>
<rect x="725" y="605" width="150" height="90" rx="14" fill="#313244" stroke="#89B4FA" stroke-width="1.7"/>
<text x="800" y="651" fill="#CDD6F4" font-size="27" font-weight="bold" text-anchor="middle">GPU 3</text>
<text x="800" y="677" fill="#BAC2DE" font-size="14" font-weight="normal" text-anchor="middle">6 NVHS groups</text>
<text x="54" y="792" fill="#CDD6F4" font-size="21" font-weight="bold" text-anchor="start">Each path represents two NVHS group pairings.</text>
<text x="54" y="826" fill="#BAC2DE" font-size="19" font-weight="normal" text-anchor="start">E and F cross without joining. NVHS numbers identify physical groups.</text>
<text x="54" y="877" fill="#FAB387" font-size="18" font-weight="normal" text-anchor="start">Data wiring only • logical topology, not PCB routing or a hardware-qualified carrier.</text>
<text x="54" y="912" fill="#BAC2DE" font-size="18" font-weight="normal" text-anchor="start">Each V100 still requires a 156.25 MHz differential NVHS clock: B/E20 (+), B/F20 (−).</text>
</g>
</svg>
